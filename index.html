<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>婚礼邀请函 · Love Terminal</title>
<meta name="description" content="冯宏远 ♥ 赵婉薇 婚礼邀请函 · 2026.11.28 18:00 · 幸福大酒店，诚邀您见证我们的婚礼">
<meta name="keywords" content="婚礼邀请函,电子请柬,H5请柬,冯宏远,赵婉薇">
<meta property="og:title" content="冯宏远 ♥ 赵婉薇 婚宴邀请函">
<meta property="og:type" content="website">
<meta property="og:description" content="2026.11.28 18:00 · 幸福大酒店（广东佛山高明），诚邀您见证我们的婚礼">
<meta property="og:image" content="https://bigbaidog.github.io/WeddingInvitation/cover.jpg">
<meta property="og:url" content="https://bigbaidog.github.io/">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0c29;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace;
  height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
.bar{display:flex;align-items:center;padding:0 12px;height:28px;position:relative}
.dot{width:12px;height:12px;border-radius:50%}
.dot+.dot{margin-left:8px}
.r{background:#ff5f57}.y{background:#febc2e}.g{background:#28c840}
.bar h1{position:absolute;left:50%;transform:translateX(-50%);font-size:13px;font-weight:600;
  color:#5c609e;text-shadow:0 0 8px rgba(92,96,158,.5);white-space:nowrap;max-width:58%;overflow:hidden;text-overflow:ellipsis}
#screen{padding:14px 16px 24px;font-size:12px;line-height:1.4;color:#e8f6ff;
  text-shadow:0 0 8px rgba(232,246,255,.5);
  flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none}
#screen::-webkit-scrollbar{display:none}
.line{white-space:pre-wrap;word-break:break-all;min-height:1em}
.dim,.cmt{color:#5c609e;text-shadow:0 0 8px rgba(92,96,158,.5)}
.ok,.prop{color:#00ffd1;text-shadow:0 0 8px rgba(0,255,209,.5)}
.blue,.var{color:#00f0ff;text-shadow:0 0 8px rgba(0,240,255,.5)}
.cmd,.op{color:#e8f6ff;text-shadow:0 0 8px rgba(232,246,255,.5)}
.p{color:#00f0ff;font-weight:700;text-shadow:0 0 8px rgba(0,240,255,.5)}
.kw{color:#ff2e88;text-shadow:0 0 8px rgba(255,46,136,.5)}
.str{color:#f9f871;text-shadow:0 0 8px rgba(249,248,113,.5)}
.fn{color:#c77dff;text-shadow:0 0 8px rgba(199,125,255,.5)}
.num{color:#33c7ff;text-shadow:0 0 8px rgba(51,199,255,.5)}
.cursor{display:inline-block;width:7px;height:1.05em;background:#00f0ff;
  vertical-align:-2px;margin-left:1px;animation:blink 1.06s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.card{margin:14px 2px 4px;border:1px solid #ff79c6;border-radius:10px;
  outline:1px dashed rgba(255,121,198,.35);outline-offset:-7px;position:relative;
  background:linear-gradient(180deg,rgba(255,121,198,.12),rgba(15,12,41,.55));
  box-shadow:0 0 22px rgba(255,121,198,.22),inset 0 0 18px rgba(255,121,198,.06);
  padding:22px 14px;text-align:center;text-shadow:none;line-height:1.75}
.card-row{opacity:0;animation:fadeUp .5s forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.heart,.t-couple{color:#ff5fa8;
  text-shadow:0 0 8px rgba(255,95,168,.9),0 0 20px rgba(255,95,168,.55),0 0 44px rgba(255,95,168,.3)}
.t-couple{font-size:24px;font-weight:700;letter-spacing:3px;margin:10px 0 2px}
.t-title{font-size:16px;font-weight:700;letter-spacing:8px;color:#ff9ecf;
  text-shadow:0 0 8px rgba(255,158,207,.5);margin:8px 0 2px}
.t-en{color:#6b7099;font-size:10px;letter-spacing:4px;text-shadow:0 0 8px rgba(107,112,153,.5)}
.t-perf{position:relative;border-top:1px dashed rgba(255,121,198,.55);margin:14px 0;width:100%}
.t-perf::before,.t-perf::after{content:'';position:absolute;top:-7px;width:14px;height:14px;border-radius:50%;
  background:#0f0c29;border:1px solid rgba(255,121,198,.45)}
.t-perf::before{left:-8px}.t-perf::after{right:-8px}
.info{color:#f3e8ff;font-size:14px;line-height:2.1;text-shadow:0 0 8px rgba(243,232,255,.5)}
.info b{color:#ffeaf6;font-weight:600;text-shadow:0 0 8px rgba(255,234,246,.5)}
a.addr{color:#ff8fd0;text-decoration:none;border-bottom:1px dashed rgba(255,143,208,.5);
  text-shadow:0 0 8px rgba(255,143,208,.5)}
a.addr:active{opacity:.7}
.label,.foot{color:#b49ad1;text-shadow:0 0 8px rgba(180,154,209,.5)}
.label{margin-right:10px}
.foot{font-size:12px;margin-top:4px}
.big-days{color:#ff9ecf;font-size:13px;margin-top:8px;text-shadow:0 0 8px rgba(255,158,207,.5)}
@media (max-width:480px){
  #screen{font-size:15px;padding:10px 10px 24px}
  .t-couple{font-size:22px}
  .t-title{letter-spacing:5px}
  .info{font-size:15px}
  .bar h1{font-size:10px}
}
</style>
</head>
<body>
<div class="bar">
  <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
  <h1>Terminal</h1>
</div>
<div id="screen"></div>
<script>
(function(){
function pad(n){return n<10?'0'+n:''+n;}
function q(s){return "'"+s+"'"}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
function jitter(ms){return ms*(0.7+0.6*Math.random());}
var groom='冯宏远',bride='赵婉薇';
var d=new Date(2026,10,28,18,0,0);
var WK=['周日','周一','周二','周三','周四','周五','周六'];
var DATE_ISO=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
var TIME_S=pad(d.getHours())+':'+pad(d.getMinutes()),wkd=WK[d.getDay()];
var vs='幸福大酒店',addr='广东省佛山市高明区荷城街道高明大道东586号';
var NAV_URL='https://uri.amap.com/navigation?from=&to=112.853881,22.892189,'+encodeURIComponent(vs)+'&mode=car&callnative=1&src=wedding-invitation';
var NAV_GROOM='https://uri.amap.com/search?keyword='+encodeURIComponent('佛山市高明区荷城街道名湖世家');
var NAV_BRIDE='https://uri.amap.com/search?keyword='+encodeURIComponent('佛山市高明区上良村赵氏大宗祠');
var lunar='农历十月二十';
var days=Math.ceil((d.getTime()-Date.now())/86400000);
document.title=groom+' ♥ '+bride+' 婚礼邀请函';
var sc=document.getElementById('screen');
function scrollDown(){sc.scrollTop=sc.scrollHeight;}
var HOLD=3;
function holdBottom(on){var lh=parseFloat(getComputedStyle(sc).lineHeight)||23;
  sc.style.paddingBottom=on?(24+HOLD*lh)+'px':'';}
function mk(cls){var s=document.createElement('span');if(cls){s.className=cls;}return s;}
function newLine(){var l=document.createElement('div');l.className='line';sc.appendChild(l);scrollDown();return l;}
function printLine(t,c){var l=newLine();if(c){l.className+=' '+c;}l.textContent=t;}
var TYPE_SPEED=30;
async function typeText(span,text,factor,punct){
  var f=factor||1;
  for(var j=0;j<text.length;j++){
    span.textContent+=text.charAt(j);scrollDown();
    var ms=TYPE_SPEED*(0.5+Math.random());
    var ch=text.charAt(j);
    if(Math.random()<0.05||(punct!==false&&(ch===' '||';,(){}\'·'.indexOf(ch)>=0))){
      ms+=TYPE_SPEED+(50+Math.random()*50);}
    await sleep(ms*f);
  }}
async function typeSegs(segs,factor,punct){var l=newLine();
  for(var i=0;i<segs.length;i++){var sp=mk(segs[i][1]);l.appendChild(sp);
    await typeText(sp,segs[i][0],factor,punct);}
  return l;}
async function printBlock(lines,cls,gap){
  for(var i=0;i<lines.length;i++){printLine(lines[i],cls);await sleep(jitter(gap||90));}}
var CODE=[
 [['const ','kw'],['wedding ','var'],['= {','op']],
 [['  groom','prop'],[': ','op'],[q(groom),'str'],['      // 他的名字，写在她备注的第一行','cmt']],
 [['  bride','prop'],[': ','op'],[q(bride),'str'],['      // 她的笑容，是他的全世界','cmt']],
 [['  date','prop'],[': ','op'],[q(DATE_ISO),'str'],['  // Save the date!','cmt']],
 [['  place','prop'],[': ','op'],[q(vs),'str']],
 [['  addr','prop'],[': ','op'],[q(addr),'str']],
 [['};','op']],
 [],
 [['function ','kw'],['bless','fn'],['(guest) {','op']],
 [['  if ','kw'],['(guest.','op'],['willCome','prop'],[') {','op']],
 [['    wedding.','op'],['join','fn'],['(guest);','op'],['   // 你的到来，是最好的礼物','cmt']],
 [['  } ','op'],['else','kw'],[' {','op']],
 [['    wedding.','op'],['miss','prop'],[' += 1;','op'],['  // 没关系，来日方长','cmt']],
 [['  }','op']],
 [['  return ','kw'],['Infinity;','num'],['    // 爱没有返回值，只有延续','cmt']],
 [['}','op']],
 [],
 [['bless','fn'],['(you);','op'],['        // you = 正在看这份请柬的你','cmt']]
];
function showCard(){
  var c=document.createElement('div');c.className='card';
  var items=[
   '<div class=t-title>婚宴请柬</div>',
   '<div class=t-en>W E D D I N G &nbsp; I N V I T A T I O N</div>',
   '<div class=t-couple>'+groom+' <span class=heart>×</span> '+bride+'</div>',
   '<div class=t-perf></div>',
   '<div class=info><span class=label>日期</span><b>'+DATE_ISO+'</b> '+wkd+' · '+lunar+'</div>',
   '<div class=info><span class=label>男方家</span><a class=addr href='+NAV_GROOM+' target=_blank>佛山市高明区荷城街道名湖世家18座1302</a></div>',
   '<div class=info><span class=label>女方家</span><a class=addr href='+NAV_BRIDE+' target=_blank>佛山市高明区荷城街道上良村128号</a></div>',
   '<div class=info><b>席设 '+vs+' · '+TIME_S+' 入席</b></div>',
   '<div class=info><span class=label>地址</span><a class=addr href='+NAV_URL+' target=_blank>'+addr+'</a></div>',
   '<div class=big-days>距婚礼还有 '+days+' 天 · 期待与你相见</div>',
   '<div class=foot>— 诚邀莅临 —</div>'
  ];
  for(var i=0;i<items.length;i++){
    var r=document.createElement('div');r.className='card-row';r.innerHTML=items[i];
    r.style.animationDelay=(i*0.2)+'s';c.appendChild(r);
  }
  sc.appendChild(c);scrollDown();
}
async function boot(){
  holdBottom(true);
  printLine('Last login: '+new Date(Date.now()-2*86400000).toLocaleString('zh-CN')+' on ttys001','dim');
  await sleep(jitter(450));
  await typeSegs([['$ ','p'],['ssh root@weddinginvite.love','cmd']]);
  await sleep(jitter(350));
  await printBlock([
   'Connecting to host weddinginvite.love (52.0.13.14) port 22...',
   'Connection established.'
  ],'dim',120);
  await sleep(jitter(250));
  var pw=newLine();
  var pwt=mk('dim');pwt.textContent="root@weddinginvite.love's password: 🔑 ";pw.appendChild(pwt);
  var pwd=mk('cmd');pw.appendChild(pwd);
  await typeText(pwd,'●●●●●●●●');
  await sleep(jitter(450));
  await printBlock([
   '[ OK ] 握手成功 · session #5201314',
   '[ OK ] 挂载 /dev/romance -> /love ... done',
   '[ OK ] 加载 love.db（已相爱 4 年 05 个月）... 100%',
   '[ OK ] 心跳服务已启动 · port 10:20'
  ],'ok',160);
  await sleep(jitter(300));
  printLine('WeddingOS v2.4.0 · 万事俱备，只差你','dim');
  await sleep(jitter(550));
  await typeSegs([['# ','p'],['cat /etc/wedding/invite.js','cmd']]);
  await sleep(jitter(250));
  for(var i=0;i<CODE.length;i++){
    if(CODE[i].length===0){printLine('');await sleep(60);continue;}
    await typeSegs(CODE[i],0.25,false);await sleep(jitter(40));
  }
  await sleep(jitter(450));
  await typeSegs([['# ','p'],['node invite.js --send-to=guest','cmd']]);
  await sleep(jitter(350));
  var pl=newLine();pl.className='line blue';
  for(var k=0;k<=20;k++){var b='[';for(var m=0;m<20;m++){b+=(m<k?'█':'░');}b+=']';
    pl.textContent='渲染邀请函 '+b+' '+(k*5)+'%';scrollDown();await sleep(jitter(60));}
  printLine('[ DONE ] 邀请函投递成功 · 请查收','ok');
  holdBottom(false);
  showCard();
  await sleep(3200);
  printLine('');
  var last=newLine();var sp=mk('p');sp.textContent='# ';last.appendChild(sp);
  var ps=mk('cmt');last.appendChild(ps);
  await typeText(ps,'PS. 本请柬长期有效 · 转发分享这份喜悦 ♥');
  last.appendChild(mk('cursor'));
}
boot();
})();
</script>
</body>
</html>
