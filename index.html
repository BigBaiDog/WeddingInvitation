<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<!-- ========== SEO ========== -->
<meta name="description" id="metaDesc" content="冯宏远 ♥ 赵婉薇 婚礼邀请函 · 2026.11.28 18:00 · 幸福大酒店，诚邀您见证我们的婚礼">
<meta name="keywords" content="婚礼邀请函,电子请柬,H5请柬,冯宏远,赵婉薇">

<!-- ========== 微信/QQ 分享卡片 ==========
     注意：微信链接卡片只读取这里的静态 meta（不执行 JS）。
     部署上线后需要：
     1. 把下面两处 YOUR-DOMAIN 换成实际域名（必须 https）
     2. 封面图放在网站根目录 cover.jpg，建议 500×400（5:4）、jpg、1MB 以内 -->
<meta property="og:title" content="冯宏远 ♥ 赵婉薇 婚礼邀请函">
<meta property="og:type" content="website">
<meta property="og:description" content="2026.11.28 18:00 · 幸福大酒店（广东佛山高明），诚邀您见证我们的婚礼">
<meta property="og:image" content="https://bigbaidog.github.io/WeddingInvitation/cover.jpg">
<meta property="og:url" content="https://bigbaidog.github.io/">

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#0f0c29;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace;
  height:100vh;height:100dvh;overflow:hidden;-webkit-font-smoothing:antialiased}
.wrap{width:100%;height:100%}
.terminal{background:#0f0c29;display:flex;flex-direction:column;height:100%;overflow:hidden}
/* macOS 标题栏 */
.bar{display:flex;align-items:center;padding:10px 14px;
  background:#0f0c29;position:relative}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.dot+.dot{margin-left:8px}
.r{background:#ff5f57}.y{background:#febc2e}.g{background:#28c840}
.bar h1{position:absolute;left:50%;transform:translateX(-50%);font-size:12px;font-weight:400;
  color:#5c609e;white-space:nowrap;max-width:58%;overflow:hidden;text-overflow:ellipsis}
/* 屏幕区 */
#screen{padding:14px 16px 24px;font-size:13px;line-height:1.75;color:#e8f6ff;
  text-shadow:0 0 8px rgba(0,240,255,.18);
  flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none}
#screen::-webkit-scrollbar{width:0;height:0;display:none}
.line{white-space:pre-wrap;word-break:break-all;min-height:1em}
/* 语法配色 */
.dim{color:#5c609e;text-shadow:none}
.ok{color:#00ffd1;text-shadow:0 0 8px rgba(0,255,209,.5)}
.blue{color:#00f0ff}.cmd{color:#e8f6ff}
.p{color:#00f0ff;font-weight:700;text-shadow:0 0 8px rgba(0,240,255,.5)}
.kw{color:#ff2e88;text-shadow:0 0 8px rgba(255,46,136,.5)}
.str{color:#f9f871;text-shadow:0 0 6px rgba(249,248,113,.35)}
.cmt{color:#5c609e;text-shadow:none}.prop{color:#00ffd1}
.fn{color:#c77dff;text-shadow:0 0 8px rgba(199,125,255,.5)}
.var{color:#00f0ff}.num{color:#33c7ff}.op{color:#e8f6ff}
/* 光标 */
.cursor{display:inline-block;width:7px;height:1.05em;background:#00f0ff;
  vertical-align:-2px;margin-left:1px;animation:blink 1.06s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
/* 请柬卡片 */
.card{margin:14px 2px 4px;border:1px solid #ff79c6;border-radius:10px;
  background:linear-gradient(180deg,rgba(255,121,198,.12),rgba(15,12,41,.55));
  box-shadow:0 0 22px rgba(255,121,198,.22),inset 0 0 18px rgba(255,121,198,.06);
  padding:22px 14px;text-align:center;text-shadow:none}
.card-row{opacity:0;animation:fadeUp .55s forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.en{color:#ff9ecf;font-size:11px;letter-spacing:3px;text-shadow:0 0 8px rgba(255,121,198,.65)}
.names{font-size:22px;color:#ff5fa8;font-weight:700;letter-spacing:2px;margin:10px 0 4px;
  text-shadow:0 0 6px rgba(255,95,168,.85),0 0 18px rgba(255,95,168,.5),0 0 40px rgba(255,95,168,.3)}
.heart{color:#ff5fa8;text-shadow:0 0 10px rgba(255,95,168,.9),0 0 24px rgba(255,95,168,.55)}
.hr{border-top:1px dashed rgba(255,121,198,.45);margin:12px auto;width:78%}
.info{color:#f3e8ff;font-size:14px;line-height:2.1}
.info b{color:#ffeaf6;font-weight:600;text-shadow:0 0 8px rgba(255,158,207,.35)}
a.addr{color:#ff8fd0;text-decoration:none;border-bottom:1px dashed rgba(255,143,208,.5);
  text-shadow:0 0 8px rgba(255,143,208,.4)}
a.addr:active{opacity:.7}
.nav-chips{margin-top:10px}
.nav-chips a{display:inline-block;margin:4px 4px 0;padding:3px 12px;border:1px solid #ff79c6;
  border-radius:12px;color:#ff9ecf;font-size:12px;text-decoration:none;
  text-shadow:0 0 6px rgba(255,121,198,.4)}
.nav-chips a:active{background:rgba(255,121,198,.18)}
.label{color:#b49ad1;margin-right:10px}
.big-days{color:#ff9ecf;font-size:13px;margin-top:8px;text-shadow:0 0 10px rgba(255,158,207,.55)}
.foot{color:#b49ad1;font-size:12px;margin-top:4px}
/* 移动端适配（终端正文 15px，接近手机浏览器默认 16px） */
@media (max-width:480px){
  #screen{font-size:15px;padding:10px 10px 24px}
  .names{font-size:20px}
  .info{font-size:15px}
  .en{font-size:12px}
  .bar h1{font-size:10px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="terminal">
    <div class="bar">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <h1>Love Terminal</h1>
    </div>
    <div id="screen"></div>
  </div>
</div>

<script>
(function(){
function rand(a){return a[Math.floor(Math.random()*a.length)];}
function pad(n){return n<10?'0'+n:''+n;}
function q(s){return String.fromCharCode(39)+s+String.fromCharCode(39);}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}

/* ============ 1. 婚礼信息 ============ */
var groom='冯宏远',bride='赵婉薇';
var d=new Date(2026,10,28,18,0,0); /* 2026年11月28日 18:00 */
var WK=['周日','周一','周二','周三','周四','周五','周六'];
var DATE_ISO=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
var TIME_S=pad(d.getHours())+':'+pad(d.getMinutes());var wkd=WK[d.getDay()];
var vs=['幸福大酒店',''];var addr='广东省佛山市高明区荷城街道高明大道东586号';
/* 各地图导航链接：装了 App 的直接拉起，没装的打开地图网页 */
var NAV_LAT='22.892189',NAV_LNG='112.853881',NAV_NAME=encodeURIComponent(vs[0]);
var NAV_URL='https://uri.amap.com/navigation?from=&to='+NAV_LNG+','+NAV_LAT+','+NAV_NAME+'&mode=car&callnative=1&src=wedding-invitation';        /* 高德 */
var NAV_BAIDU='https://map.baidu.com/mobile/webapp/navi/geocoder/?location='+NAV_LAT+','+NAV_LNG+'&name='+NAV_NAME+'&src=wedding-invitation&coord_type=0'; /* 百度（coord_type=0 表示 GCJ-02 坐标） */
var NAV_TENCENT='https://apis.map.qq.com/uri/v1/routeplan?type=drive&to='+NAV_LAT+','+NAV_LNG+','+NAV_NAME+'&referer=wedding-invitation';             /* 腾讯 */
var NAV_APPLE='https://maps.apple.com/?ll='+NAV_LAT+','+NAV_LNG+'&daddr='+NAV_NAME+'&address='+encodeURIComponent(addr);                                /* Apple 地图 */
var yrs=rand(['3','5','6','7']),mon=pad(Math.floor(Math.random()*12)+1); /* 已相爱时长，可替换为真实值 */
var lunar='农历十月二十';
var days=Math.ceil((d.getTime()-Date.now())/86400000);

/* 页面标签标题（微信分享卡片用的是 <head> 里的静态 og: meta，JS 修改对其无效） */
document.title=groom+' ♥ '+bride+' 婚礼邀请函';

/* ============ 2. 终端输出工具 ============ */
var sc=document.getElementById('screen');
function scrollDown(){sc.scrollTop=sc.scrollHeight;}
/* 打字阶段底部留白 3 行，请柬出现前光标不顶到屏幕底边 */
var HOLD=3;
function holdBottom(on){var lh=parseFloat(getComputedStyle(sc).lineHeight)||23;
  sc.style.paddingBottom=on?(24+HOLD*lh)+'px':'';}
function mk(cls){var s=document.createElement('span');if(cls){s.className=cls;}return s;}
function newLine(){var l=document.createElement('div');l.className='line';sc.appendChild(l);scrollDown();return l;}
function printLine(t,c){var l=newLine();if(c){l.className+=' '+c;}l.textContent=t;}
async function typeSegs(segs,speed){var l=newLine();
  for(var i=0;i<segs.length;i++){var sp=mk(segs[i][1]);l.appendChild(sp);var t=segs[i][0];
    for(var j=0;j<t.length;j++){sp.textContent+=t.charAt(j);scrollDown();
      var ms=(speed||20)*(0.6+Math.random());
      var ch=t.charAt(j);
      if(Math.random()<0.05){ms+=150+Math.random()*200;}          /* 5% 概率"想一下"，停 150~350ms */
      if(ch===' '||';,(){}\''.indexOf(ch)>=0){ms+=15+Math.random()*35;} /* 空格/标点后面稍微顿一下 */
      await sleep(ms);}}
  return l;}
async function printBlock(lines,cls,gap){
  for(var i=0;i<lines.length;i++){printLine(lines[i],cls);await sleep(gap||90);}}

/* ============ 3. 代码打字内容（带语法高亮分段） ============ */
function buildCode(){return [
 [['const ','kw'],['wedding ','var'],['= {','op']],
 [['  groom','prop'],[': ','op'],[q(groom),'str'],['  // 他的名字，写在她备注的第一行','cmt']],
 [['  bride','prop'],[': ','op'],[q(bride),'str'],['  // 她的笑容，是他的全世界','cmt']],
 [['  date','prop'],[': ','op'],[q(DATE_ISO),'str'],['  // Save the date!','cmt']],
 [['  place','prop'],[': ','op'],[q(vs[0]+(vs[1]?' · '+vs[1]:'')),'str']],
 [['  addr','prop'],[': ','op'],[q(addr),'str']],
 [['};','op']],
 [],
 [['function ','kw'],['bless','fn'],['(guest) {','op']],
 [['  if ','kw'],['(guest.','op'],['willCome','prop'],[') {','op']],
 [['    wedding.','op'],['join','fn'],['(guest);','op'],['   // 你的到来，是最好的礼物','cmt']],
 [['  } ','op'],['else','kw'],[' {','op']],
 [['    wedding.','op'],['miss','prop'],[' += 1;','op'],['  // 没关系，来日方长','cmt']],
 [['  }','op']],
 [['  return ','kw'],['Infinity;','num'],['    // 爱没有返回值，只有延续','cmt']],
 [['}','op']],
 [],
 [['bless','fn'],['(you);','op'],['   // you = 正在看这份请柬的你','cmt']]
];}

/* ============ 4. 请柬卡片 ============ */
function row(html){var r=document.createElement('div');r.className='card-row';r.innerHTML=html;return r;}
function showCard(){
  var c=document.createElement('div');c.className='card';
  var items=[
   '<div class=en>W E D D I N G · I N V I T A T I O N</div>',
   '<div class=names>'+groom+' <span class=heart>♥</span> '+bride+'</div>',
   '<div style=color:#b49ad1;font-size:12px>佳期已定 · 敬备喜酌 · 诚邀见证</div>',
   '<div class=hr></div>',
   '<div class=info><span class=label>时间</span><b>'+DATE_ISO+'</b> '+wkd+' '+TIME_S+'</div>',
   '<div class=info><span class=label>'+lunar+'</span></div>',
   '<div class=info><span class=label>席设</span><b>'+vs[0]+(vs[1]?' · '+vs[1]:'')+'</b></div>',
   '<div class=info><span class=label>地址</span><a class=addr href='+NAV_URL+' target=_blank>'+addr+' · 点击导航</a></div>',
   '<div class=nav-chips><span class=label>地图导航</span><a target=_blank href='+NAV_URL+'>高德</a><a target=_blank href='+NAV_BAIDU+'>百度</a><a target=_blank href='+NAV_TENCENT+'>腾讯</a><a target=_blank href='+NAV_APPLE+'>Apple</a></div>',
   '<div class=big-days>距婚礼还有 '+days+' 天 · 期待与你相见</div>',
   '<div class=hr></div>',
   '<div class=foot>你们的到来，将是我们婚礼最美好的祝福</div>'
  ];
  for(var i=0;i<items.length;i++){var r=row(items[i]);r.style.animationDelay=(i*0.25)+'s';c.appendChild(r);}
  sc.appendChild(c);scrollDown();
}

/* ============ 5. 主流程：登录 → 初始化 → 打代码 → 渲染卡片 ============ */
async function boot(){
  holdBottom(true);
  await sleep(500);
  printLine('Last login: '+new Date(Date.now()-2*86400000).toLocaleString('zh-CN')+' on ttys001','dim');
  await sleep(450);
  await typeSegs([['$ ','p'],['ssh root@weddinginvite.love','cmd']],50);
  await sleep(350);
  await printBlock([
   'Connecting to host weddinginvite.love (52.0.13.14) port 22...',
   'Connection established.'
  ],'dim',120);
  await sleep(250);
  await typeSegs([['root@weddinginvite.love'+"'"+'s password: 🔑 ','dim'],['●●●●●●●●','cmd']],60);
  await sleep(450);
  await printBlock([
   '[ OK ] 握手成功 · session #5201314',
   '[ OK ] 挂载 /dev/romance -> /love ... done',
   '[ OK ] 加载 love.db（已相爱 4 年 05 个月）... 100%',
   '[ OK ] 心跳服务已启动 · port 10:20'
  ],'ok',160);
  await sleep(300);
  printLine('WeddingOS v2.4.0 · 万事俱备，只差你','dim');
  await sleep(550);
  await typeSegs([['# ','p'],['cat /etc/wedding/invite.js','cmd']],50);
  await sleep(250);
  var CODE=buildCode();
  for(var i=0;i<CODE.length;i++){
    if(CODE[i].length===0){printLine('');await sleep(60);continue;}
    await typeSegs(CODE[i],12);await sleep(40);
  }
  await sleep(450);
  await typeSegs([['# ','p'],['node invite.js --send-to=guest','cmd']],45);
  await sleep(350);
  var pl=newLine();pl.className='line blue';
  for(var k=0;k<=20;k++){var b='[';for(var m=0;m<20;m++){b+=(m<k?'█':'░');}
    pl.textContent='渲染邀请函 '+b+' '+(k*5)+'%';scrollDown();await sleep(60);}
  printLine('[ DONE ] 邀请函投递成功 · 请查收','ok');
  await sleep(400);
  holdBottom(false);
  showCard();
  await sleep(3200);
  printLine('');
  /* 最后一行：$ 提示符 + PS（逐字打字），光标跟在句尾 */
  var last=newLine();var sp=mk('p');sp.textContent='# ';last.appendChild(sp);
  var ps=mk('cmt');last.appendChild(ps);
  var pstext='PS. 本请柬长期有效 · 转发分享这份喜悦 ♥';
  for(var i=0;i<pstext.length;i++){
    ps.textContent+=pstext.charAt(i);scrollDown();
    var ms=45*(0.6+Math.random());
    var ch=pstext.charAt(i);
    if(Math.random()<0.05){ms+=150+Math.random()*200;}          /* 偶尔"想一下" */
    if(ch===' '||';,(){}·'.indexOf(ch)>=0){ms+=15+Math.random()*35;} /* 标点/空格微顿 */
    await sleep(ms);
  }
  last.appendChild(mk('cursor'));
}
boot();
})();
</script>
</body>
</html>
